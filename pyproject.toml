[project]
name = "swapgate"
version = "0.2.2"
description = "Open-source model-swap eval gate: production traces become evals, candidate models must pass before you swap."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nitish Agarwal" }]
keywords = ["llm", "eval", "regression-testing", "open-weights", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []
dynamic = []

[project.optional-dependencies]
dev = ["pytest>=8"]
e2e = ["litellm>=1.89,<2"]
hosted = ["stripe>=16,<17", "razorpay>=2,<3"]

[project.scripts]
swapgate = "swapgate.cli:main"

[project.urls]
Homepage = "https://github.com/nitishagar/swapgate"
Documentation = "https://nitishagar.github.io/swapgate/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swapgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: requires a real OpenAI-compatible endpoint (SWAPGATE_LIVE=1)",
]
