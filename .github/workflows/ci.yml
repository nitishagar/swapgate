name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  python-gates:
    name: G0-G5 pytest (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q

  ts-sdk:
    name: TS SDK tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/swapgate-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/swapgate-js/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  e2e-tracing:
    name: Local-tracing e2e (LiteLLM mock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev,e2e]'
      - run: python -m pytest -q tests/e2e

  packaging:
    name: sdist install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build --sdist
      - run: |
          python -m venv /tmp/sg-sdist-env
          /tmp/sg-sdist-env/bin/pip install dist/*.tar.gz
          /tmp/sg-sdist-env/bin/swapgate --version

  action-selftest-pass:
    name: Action self-test (parity passes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fixture suite
        run: |
          pip install -e .
          swapgate capture --from litellm --in fixtures/traces-litellm.jsonl --out /tmp/ev.jsonl
          swapgate build-evals --in /tmp/ev.jsonl --out /tmp/selftest.json --name selftest
          swapgate build-evals --out /tmp/selftest.json --approve
          cp /tmp/selftest.json ./selftest-suite.json
      - uses: ./action
        with:
          suite: selftest-suite.json
          baseline: mock:parity
          candidate: mock:parity

  action-selftest-fail:
    name: Action self-test (regression fails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build fixture suite
        run: |
          pip install -e .
          swapgate capture --from litellm --in fixtures/traces-litellm.jsonl --out /tmp/ev.jsonl
          swapgate build-evals --in /tmp/ev.jsonl --out /tmp/selftest.json --name selftest
          swapgate build-evals --out /tmp/selftest.json --approve
          cp /tmp/selftest.json ./selftest-suite.json
      - id: gate
        uses: ./action
        continue-on-error: true
        with:
          suite: selftest-suite.json
          baseline: mock:parity
          candidate: mock:regress
          fail-under: '0.5'
      - name: Assert the gate failed
        run: |
          test "${{ steps.gate.outputs.passed }}" = "false"
          test -f swapgate-receipt.json

  container-smoke:
    name: Container smoke (hosted API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t swapgate:test .
      - name: Exercise the hosted API
        run: |
          docker run -d --name sg -p 8000:8000 \
            -e STRIPE_WEBHOOK_SECRET=whsec_smoke -e RAZORPAY_WEBHOOK_SECRET=rzpay_smoke \
            -e RAZORPAY_TEST_ACCOUNTS=acc_test1 swapgate:test
          sleep 6
          KEY=$(docker exec sg swapgate teams create smoke --history /data/runs.db)
          test ${#KEY} -gt 20
          cat > /tmp/suite.json <<'EOF'
          {"suite": {"name": "smoke", "version": "0.1.0", "metadata": {"approved": {"by": "human", "at": "t"}},
           "cases": [{"id": "s1", "input": [{"role": "user", "content": "Summarise the refund policy"}],
           "rubric": [{"type": "contains", "values": ["refund", "policy"]}], "expected": "", "tags": [], "source_trace_ids": []}]},
           "baseline": "mock:parity", "candidate": "mock:parity"}
          EOF
          curl -sf -X POST localhost:8000/v1/compare -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' -d @/tmp/suite.json -o /tmp/receipt.json
          python3 -c "import json; r=json.load(open('/tmp/receipt.json')); assert r['receipt']['summary']['passed'] is True"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/compare \
            -H 'Content-Type: application/json' -d @/tmp/suite.json)" = "401"
          python3 - <<'EOF'
          import hashlib, hmac, json, time, urllib.request, urllib.error
          def post(path, raw, headers):
              req = urllib.request.Request(f"http://localhost:8000{path}", data=raw, method="POST", headers=headers)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.status
              except urllib.error.HTTPError as e:
                  return e.code
          payload = json.dumps({"id": "evt_smoke", "type": "t", "livemode": False}).encode()
          ts = str(int(time.time()))
          sig = hmac.new(b"whsec_smoke", f"{ts}.".encode() + payload, hashlib.sha256).hexdigest()
          assert post("/v1/billing/stripe/webhook", payload, {"Stripe-Signature": f"t={ts},v1={sig}"}) == 200
          assert post("/v1/billing/stripe/webhook", payload, {"Stripe-Signature": "t=1,v1=dead"}) == 400
          body = json.dumps({"event": "payment.captured", "account_id": "acc_test1",
                             "payload": {"payment": {"entity": {"id": "pay_smoke"}}}}).encode()
          sig2 = hmac.new(b"rzpay_smoke", body, hashlib.sha256).hexdigest()
          assert post("/v1/billing/razorpay/webhook", body, {"X-Razorpay-Signature": sig2}) == 200
          assert post("/v1/billing/razorpay/webhook", body, {"X-Razorpay-Signature": "dead"}) == 400
          print("webhooks ok")
          EOF
          docker stop sg >/dev/null

  scheduled-selftest:
    name: Scheduled self-test (run-scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scheduler twice
        run: |
          pip install -e .
          swapgate run-scheduled --schedules examples/scheduled/schedules.json --history /tmp/sched-runs.db --force
          swapgate run-scheduled --schedules examples/scheduled/schedules.json --history /tmp/sched-runs.db
